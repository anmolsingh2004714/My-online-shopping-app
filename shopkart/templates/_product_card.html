<article class="group flex flex-col overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm transition hover:-translate-y-0.5 hover:shadow-md">
  <a href="{{ url_for('product_details', product_id=product['id']) }}" class="block aspect-[4/3] overflow-hidden bg-slate-100">
    <img src="{{ url_for('static', filename='img/' ~ product['image'] ~ '.svg') }}" alt="{{ product['name'] }}"
         class="h-full w-full object-cover transition group-hover:scale-105" loading="lazy">
  </a>

  <div class="flex flex-1 flex-col gap-2 p-4">
    <p class="text-xs font-semibold uppercase tracking-wide text-brand-600">{{ product['category'] }}</p>
    <h3 class="text-sm font-semibold leading-snug sm:text-base">
      <a href="{{ url_for('product_details', product_id=product['id']) }}" class="hover:text-brand-600">{{ product['name'] }}</a>
    </h3>
    <p class="text-xs text-slate-500">★ {{ product['rating'] }} · {{ product['stock'] }} in stock</p>

    <div class="mt-auto flex items-center justify-between gap-2 pt-2">
      <span class="text-base font-bold sm:text-lg">{{ product['price']|rupees }}</span>
      <form action="{{ url_for('add_to_cart', product_id=product['id']) }}" method="post">
        <input type="hidden" name="next" value="{{ request.full_path }}">
        <button type="submit"
                class="rounded-lg bg-brand-600 px-3 py-2 text-xs font-semibold text-white hover:bg-brand-700 sm:text-sm">
          Add to cart
        </button>
      </form>
    </div>
  </div>
</article>
