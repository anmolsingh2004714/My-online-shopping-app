{% extends "base.html" %}
{% block title %}Not found — ShopKart{% endblock %}

{% block content %}
<div class="mx-auto max-w-lg rounded-2xl border border-slate-200 bg-white p-10 text-center">
  <p class="text-5xl font-extrabold text-brand-600">404</p>
  <h1 class="mt-3 text-xl font-bold">We couldn’t find that page</h1>
  <p class="mt-2 text-sm text-slate-500">The product may have been removed or the link is incorrect.</p>
  <a href="{{ url_for('products') }}"
     class="mt-6 inline-block rounded-lg bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-brand-700">
    Back to shop
  </a>
</div>
{% endblock %}
