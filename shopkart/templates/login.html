{% extends "base.html" %}
{% block title %}Sign in — ShopKart{% endblock %}

{% block content %}
<div class="mx-auto max-w-md">
  <div class="rounded-2xl border border-slate-200 bg-white p-6 sm:p-8">
    <h1 class="text-2xl font-bold">Welcome back</h1>
    <p class="mt-1 text-sm text-slate-500">Sign in to view your cart and orders.</p>

    <form method="post" class="mt-6 space-y-4">
      <div>
        <label for="email" class="text-sm font-medium">Email</label>
        <input id="email" name="email" type="email" required autocomplete="email"
               class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:border-brand-500 focus:outline-none">
      </div>
      <div>
        <label for="password" class="text-sm font-medium">Password</label>
        <input id="password" name="password" type="password" required autocomplete="current-password"
               class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:border-brand-500 focus:outline-none">
      </div>
      <button type="submit"
              class="w-full rounded-lg bg-brand-600 px-4 py-3 text-sm font-semibold text-white hover:bg-brand-700">
        Sign in
      </button>
    </form>

    <p class="mt-5 text-sm text-slate-500">
      New here? <a href="{{ url_for('register') }}" class="font-semibold text-brand-600 hover:underline">Create an account</a>
    </p>
    <p class="mt-3 rounded-lg bg-slate-50 px-3 py-2 text-xs text-slate-500">
      Demo account — demo@shopkart.test / demo1234
    </p>
  </div>
</div>
{% endblock %}
