{% extends "base.html" %}
{% block title %}Create account — ShopKart{% endblock %}

{% block content %}
<div class="mx-auto max-w-md">
  <div class="rounded-2xl border border-slate-200 bg-white p-6 sm:p-8">
    <h1 class="text-2xl font-bold">Create your account</h1>
    <p class="mt-1 text-sm text-slate-500">It takes less than a minute.</p>

    <form method="post" class="mt-6 space-y-4">
      <div>
        <label for="full_name" class="text-sm font-medium">Full name</label>
        <input id="full_name" name="full_name" required autocomplete="name"
               class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:border-brand-500 focus:outline-none">
      </div>
      <div>
        <label for="email" class="text-sm font-medium">Email</label>
        <input id="email" name="email" type="email" required autocomplete="email"
               class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:border-brand-500 focus:outline-none">
      </div>
      <div>
        <label for="phone" class="text-sm font-medium">Phone <span class="text-slate-400">(optional)</span></label>
        <input id="phone" name="phone" inputmode="tel" autocomplete="tel"
               class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:border-brand-500 focus:outline-none">
      </div>
      <div>
        <label for="password" class="text-sm font-medium">Password</label>
        <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password"
               class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:border-brand-500 focus:outline-none">
        <p class="mt-1 text-xs text-slate-400">At least 8 characters.</p>
      </div>
      <button type="submit"
              class="w-full rounded-lg bg-brand-600 px-4 py-3 text-sm font-semibold text-white hover:bg-brand-700">
        Create account
      </button>
    </form>

    <p class="mt-5 text-sm text-slate-500">
      Already registered? <a href="{{ url_for('login') }}" class="font-semibold text-brand-600 hover:underline">Sign in</a>
    </p>
  </div>
</div>
{% endblock %}
