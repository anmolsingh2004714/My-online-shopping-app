{% extends "base.html" %}

{% block title %}Admin Dashboard{% endblock %}

{% block content %}

<h2 class="text-center mb-4">📊 Admin Dashboard</h2>

<div class="row">

    <div class="col-md-4">
        <div class="card text-center shadow p-4">
            <h3>{{ total_users }}</h3>
            <p>Total Users</p>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card text-center shadow p-4">
            <h3>{{ total_products }}</h3>
            <p>Total Products</p>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card text-center shadow p-4">
            <h3>{{ total_orders }}</h3>
            <p>Total Orders</p>
        </div>
    </div>

</div>

{% endblock %}
