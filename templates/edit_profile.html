{% extends "base.html" %}

{% block title %}Edit Profile{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow p-4">

            <h2 class="text-center mb-4">✏ Edit Profile</h2>

            <form method="POST">

                <div class="mb-3">
                    <label>Full Name</label>
                    <input type="text"
                           name="full_name"
                           class="form-control"
                           value="{{ user[0] }}"
                           required>
                </div>

                <div class="mb-3">
                    <label>Phone</label>
                    <input type="text"
                           name="phone"
                           class="form-control"
                           value="{{ user[1] }}"
                           required>
                </div>

                <button class="btn btn-primary w-100">
                    Update Profile
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
