{% extends "base.html" %}

{% block title %}Edit Product{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow p-4">

            <h2 class="text-center mb-4">Edit Product</h2>

            <form method="POST">

                <div class="mb-3">
                    <label>Product Name</label>
                    <input type="text"
                           name="name"
                           class="form-control"
                           value="{{ product[1] }}"
                           required>
                </div>

                <div class="mb-3">
                    <label>Description</label>
                    <textarea name="description"
                              class="form-control"
                              rows="4">{{ product[2] }}</textarea>
                </div>

                <div class="mb-3">
                    <label>Price</label>
                    <input type="number"
                           name="price"
                           class="form-control"
                           value="{{ product[3] }}"
                           required>
                </div>

                <div class="mb-3">
                    <label>Stock</label>
                    <input type="number"
                           name="stock"
                           class="form-control"
                           value="{{ product[4] }}"
                           required>
                </div>

                <button class="btn btn-warning w-100">
                    Update Product
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
