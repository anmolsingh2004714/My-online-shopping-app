{% extends "base.html" %}

{% block title %}Forgot Password{% endblock %}

{% block content %}

<div class="container mt-5" style="max-width:500px;">

<h2 class="mb-4 text-center">
Forgot Password
</h2>

<form method="POST">

    <input
        type="email"
        name="email"
        class="form-control mb-3"
        placeholder="Enter Email"
        required>

    <button class="btn btn-primary w-100">
        Send OTP
    </button>

</form>

</div>

{% endblock %}
